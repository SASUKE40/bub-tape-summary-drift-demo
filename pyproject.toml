[project]
name = "bub-tape-summary-drift-demo"
version = "0.1.0"
description = "Reproducible experiment for summary drift across Bub tape handoffs"
requires-python = ">=3.12,<4.0"
dependencies = [
  "bub @ git+https://github.com/bubbuild/bub.git",
  "pydantic>=2.0",
  "rich>=13.0",
  "typer>=0.12",
  "matplotlib>=3.9",
]

[project.scripts]
tape-drift = "tape_drift_demo.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/tape_drift_demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
